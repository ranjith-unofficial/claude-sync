<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session 1 — Backup Deck (69 slides)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#e9edf2; --surface:#ffffff; --surface2:#f3f6f9; --line:#dbe2ea;
 --ink:#0f172a; --ink2:#46556a; --ink3:#64748b;
 --cyan:#047857; --amber:#047857; --purple:#334155; --green:#047857; --rose:#b4232a;
}
html,body{height:100%;background:var(--bg);color:var(--ink);
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body.overview{overflow:auto}

/* ---------- deck / slide ---------- */
#deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:2vmin}
.slide{width:min(96vw,calc(94vh*16/9));aspect-ratio:16/9;background:var(--surface);
 border:1px solid var(--line);border-radius:14px;padding:4.2% 5%;box-shadow:0 3px 22px rgba(15,23,42,.09);
 display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.slide.cols{display:grid;grid-template-columns:55% 45%;gap:3%;align-items:center}
.stxt{min-width:0;display:flex;flex-direction:column;justify-content:center}
.svis{min-width:0;display:flex;align-items:center;justify-content:center;height:100%;max-height:78%}
.svis svg{width:100%;height:100%;max-height:100%;overflow:visible}

.badge{font-size:1.15vh;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
 color:var(--cyan);margin-bottom:1.6vh;display:inline-block}
.badge.demo{color:var(--amber)}
h1.st{font-size:4.6vh;line-height:1.12;font-weight:600;letter-spacing:-.02em;margin-bottom:1.2vh}
.sub{font-size:2.05vh;color:var(--ink2);line-height:1.45;margin-bottom:2.4vh}
.pts{display:flex;flex-direction:column;gap:1.7vh}
.pt{border-left:2px solid var(--line);padding-left:1.6vh}
.pt .pth{font-size:2.35vh;font-weight:650;line-height:1.3}
.pt .ptd{font-size:1.85vh;color:var(--ink2);line-height:1.45;margin-top:.35vh}
.slide.cols h1.st{font-size:3.9vh} .slide.cols .pt .pth{font-size:2.05vh}
.slide.cols .pt .ptd{font-size:1.7vh} .slide.cols .pts{gap:1.35vh}

/* title slides */
.slide.tt{align-items:flex-start;justify-content:center;
 background:var(--surface);border-left:7px solid var(--green)}
.slide.tt h1.st{font-size:6.6vh;max-width:16ch}
.slide.tt .sub{font-size:2.4vh;max-width:52ch}
.author{font-size:1.6vh;color:var(--ink3);margin-top:2vh}

/* poll */
.opts{display:grid;gap:1.3vh;margin-top:1vh}
.opt{background:var(--surface2);border:1px solid var(--line);border-radius:9px;
 padding:1.5vh 2vh;font-size:2.05vh;display:flex;align-items:center;gap:1.4vh}
.opt .k{color:var(--cyan);font-weight:800;font-variant-numeric:tabular-nums}
.qn{font-size:2.3vh;color:var(--ink2);margin-bottom:1.6vh}
.livetag{position:absolute;top:3.5%;right:5%;font-size:1.2vh;font-weight:800;
 letter-spacing:.1em;color:var(--rose);display:flex;align-items:center;gap:.7vh}
.livetag i{width:.9vh;height:.9vh;border-radius:50%;background:var(--rose);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}

/* prompt card */
.pcard{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:2.2vh 2.4vh;
 font-family:ui-monospace,Menlo,monospace;font-size:1.62vh;line-height:1.55;color:var(--ink);
 white-space:pre-wrap;overflow:auto;max-height:52vh}
/* takeaways */
.tks{display:flex;flex-direction:column;gap:1.5vh;margin-top:1vh}
.tk{display:flex;gap:1.4vh;font-size:2.05vh;line-height:1.4}
.tk .n{color:var(--cyan);font-weight:800;flex:none}

.ph{font-family:ui-monospace,Menlo,monospace;color:#92400e;
 background:#fef3c7;border:1px solid #f0c14b;
 border-radius:4px;padding:0 .5vh;font-size:.92em}

/* ---------- stagger ---------- */
.rv{opacity:0;transform:translateY(9px)}
.slide.go .rv{animation:rvin .42s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rvin{to{opacity:1;transform:none}}
.slide.go .svis{animation:vin .55s cubic-bezier(.22,1,.36,1) both}
@keyframes vin{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}

/* ---------- chrome ---------- */
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--cyan);transition:width .25s;z-index:20}
#hud{position:fixed;bottom:1.6vh;right:2vw;font-size:1.5vh;color:var(--ink3);
 font-variant-numeric:tabular-nums;z-index:20;display:flex;gap:1.6vh;align-items:center}
#hud b{color:var(--ink2);font-weight:600}
#part{position:fixed;bottom:1.6vh;left:2vw;font-size:1.4vh;color:var(--ink3);
 letter-spacing:.08em;text-transform:uppercase;z-index:20}
#help{position:fixed;top:1.6vh;left:2vw;font-size:1.3vh;color:var(--ink3);z-index:20;opacity:.75}
kbd{background:var(--surface2);border:1px solid var(--line);border-radius:4px;
 padding:.1vh .7vh;font-family:inherit;font-size:.95em}

/* ---------- overview ---------- */
#ov{display:none;padding:28px;background:var(--bg);min-height:100%}
body.overview #deck{display:none} body.overview #ov{display:block}
body.overview #hud,body.overview #part,body.overview #bar{display:none}
.ovh{max-width:1500px;margin:0 auto 22px;display:flex;justify-content:space-between;
 align-items:flex-end;flex-wrap:wrap;gap:14px}
.ovh h2{font-size:24px;font-weight:600}
.ovh p{color:var(--ink3);font-size:13px;margin-top:5px}
.stat{display:flex;gap:22px;font-size:12.5px;color:var(--ink3)}
.stat b{display:block;font-size:21px;color:var(--ink);font-weight:700;
 font-variant-numeric:tabular-nums;line-height:1.2}
.stat .warn b{color:var(--amber)}
.grid{max-width:1500px;margin:0 auto;display:grid;
 grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mini{background:var(--surface);box-shadow:0 1px 6px rgba(15,23,42,.06);border:1px solid var(--line);border-radius:9px;
 aspect-ratio:16/9;padding:12px;cursor:pointer;overflow:hidden;position:relative;
 display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.mini:hover{border-color:var(--cyan);transform:translateY(-2px)}
.mini .mn{position:absolute;top:7px;right:9px;font-size:10px;color:var(--ink3);
 font-variant-numeric:tabular-nums}
.mini .mb{font-size:7.5px;font-weight:800;letter-spacing:.1em;color:var(--cyan);
 text-transform:uppercase;margin-bottom:5px;padding-right:22px}
.mini .mt{font-size:12.5px;font-weight:650;line-height:1.25}
.mini .ms{font-size:10px;color:var(--ink3);margin-top:4px;line-height:1.3;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .mp{margin-top:6px;font-size:9.5px;color:var(--ink3);line-height:1.35;
 display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini.hasph{border-color:rgba(251,191,36,.5)}
.mini.dense{border-color:rgba(251,113,133,.5)}
.mini .flag{position:absolute;bottom:7px;right:9px;font-size:8.5px;font-weight:800;
 letter-spacing:.06em;text-transform:uppercase}
.mini .flag.ph{color:var(--amber)} .mini .flag.dn{color:var(--rose)}
.mini .flag.vs{color:var(--purple)}
.pt-head{max-width:1500px;margin:26px auto 10px;font-size:12px;font-weight:800;
 letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
 border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){
 .rv,.slide.go .rv,.slide.go .svis{animation:none!important;opacity:1!important;transform:none!important}
 .livetag i{animation:none}
}
@media print{
 html,body{overflow:visible;background:#fff}
 #hud,#part,#bar,#help,#ov{display:none!important}
 #deck{position:static;display:block;padding:0}
 .slide{page-break-after:always;width:100%;margin-bottom:0}
}
</style></head><body>

p our end.", "badge": "THE DEAL", "points": [{"title": "Phones on silent", "description": "Not away. On silent. You will need them."}, {"title": "And one task, right now", "description": "Before I teach you anything. It takes six minutes."}], "isStudentViewEnabled": true, "id": "slide-5"}, {"type": "content", "title": "Task 1 — write this email. Right now.", "subtitle": "Do not overthink it. Write it the way you'd write it tonight.", "badge": "⚡ DO THIS NOW · 6 MINUTES", "points": [{"title": "Apply for an AI Research Intern role", "description": "Write to the hiring manager. Details on the next slide."}, {"title": "Use AI if you want. Or don't.", "description": "Completely up to you. Work how you normally work."}, {"title": "Send it to yourself, or to ranjith@ranjith.tech", "description": "We are coming back to this email later. Keep it."}], "isStudentViewEnabled": true, "id": "slide-6"}, {"id": "slide-7", "type": "prompt-card", "isStudentViewEnabled": true, "title": "The job you're applying for", "badge": "📋 THE FULL JOB DESCRIPTION", "subtitle": "Read it properly. Copy it if you want — your email should answer what's in here.", "promptText": "NEXORA AI  ·  Bangalore  ·  40 people\nAI RESEARCH INTERN  ·  6 months  ·  starts January  ·  paid  ·  hybrid (3 days in office)\nHiring manager: Priya Raghavan, Head of AI Research\n\nABOUT THE TEAM\nWe are a nine-person applied research team. We build LLM systems that go into\nproduction for fintech and healthcare clients — fraud detection, claims\nprocessing, and document search over very messy archives.\n\nWHAT YOU WILL ACTUALLY DO\n- Prepare and clean datasets, and build the evaluation sets we test against\n- Train baseline models and run experiments to see what actually improves them\n- Test where our LLM pipelines break — bad retrieval, hallucination, edge cases\n- Read recent papers and summarise what is worth trying, in one page\n- Build small proof-of-concept demos the client team can look at\n- Write up what you did so the next person can repeat it\n\nWHAT WE NEED\n- Python. You should be able to open a messy dataset and get somewhere alone\n- Understanding of basic ML: train/test splits, overfitting, evaluation metrics\n- One project you can defend in detail — what you chose, and what broke\n- Ability to explain a technical idea to someone who is not technical\n\nNICE TO HAVE\n- Anything you have built with an LLM API, however small\n- A public GitHub with commits that are not all from one weekend\n- Any experience with RAG, embeddings or vector search\n\nWHAT WE DO NOT NEED\n- A perfect CGPA. We have hired people with 6.5\n- Prior internships. This may well be your first\n- Certificates. We will ask you to explain something instead"}, {"type": "title", "title": "Part 1 — Why AI", "subtitle": "Before how it works, why you should care.", "author": "", "badge": "PART 1 OF 5", "isStudentViewEnabled": true, "id": "slide-8"}, {"type": "content", "title": "AI, in one line", "subtitle": "", "badge": "DEFINITION", "points": [{"title": "A machine doing something that normally needs a human brain", "description": "That's it. No magic. Chess apps, spam filters, ChatGPT — all AI."}], "isStudentViewEnabled": true, "id": "slide-9"}, {"type": "content", "title": "You already used AI six times today", "subtitle": "", "badge": "WITHOUT NOTICING", "points": [{"title": "Your phone unlocked by looking at your face", "description": "That's AI."}, {"title": "Instagram knew what to show you next", "description": "That's AI."}, {"title": "Maps picked your route and predicted traffic", "description": "That's AI."}, {"title": "Autocorrect fixed your typing", "description": "Also AI."}], "visual": {"kind": "daily-ai", "spec": "Six phone-screen icons in a grid — face unlock, Instagram feed, Maps route, autocorrect keyboard, YouTube, UPI fraud alert — each with a small check mark."}, "isStudentViewEnabled": true, "id": "slide-10"}, {"type": "content", "title": "So what happens if you don't learn this?", "subtitle": "World Economic Forum, Future of Jobs 2025 — 1,000+ employers surveyed", "badge": "BE HONEST ABOUT IT", "points": [{"title": "92 million jobs displaced by 2030", "description": "Routine, repeatable, rule-based work goes first."}, {"title": "But 170 million new ones created", "description": "A net gain of 78 million. The work changes shape — it does not vanish."}, {"title": "39% of your core skills will change", "description": "Whatever you learn now has a shelf life. That is the real message."}], "visual": {"kind": "jobs-balance", "spec": "Two bars: 92M displaced vs 170M created, with net +78M called out between them."}, "isStudentViewEnabled": true, "id": "slide-11"}, {"type": "content", "title": "And the part nobody tells you", "subtitle": "India-specific figures — verify before quoting", "badge": "THE OPPORTUNITY", "points": [{"title": "Only about 16% of Indian IT professionals are AI-skilled", "description": "Roughly one in six. That is your entire competition."}, {"title": "About half of AI roles go unfilled", "description": "Not because nobody applies. Because too few can do the work."}, {"title": "You have two years to be in that 16%", "description": "Starting this morning."}], "visual": {"kind": "supply-gap", "spec": "Tall DEMAND bar vs short 16% SUPPLY bar, the gap between them labelled 'your window'."}, "isStudentViewEnabled": true, "id": "slide-12"}, {"type": "title", "title": "Part 2 — What is AI", "subtitle": "We covered why. Now what it actually is.", "author": "", "badge": "PART 2 OF 5", "isStudentViewEnabled": true, "id": "slide-13"}, {"type": "content", "title": "The family tree", "subtitle": "Each one sits inside the one before it", "badge": "HOW IT ALL FITS", "points": [{"title": "Artificial Intelligence", "description": "Google Maps picking your route."}, {"title": "→ Machine Learning", "description": "YouTube learning what you'll watch next."}, {"title": "→ Deep Learning", "description": "Your phone's face unlock."}, {"title": "→ Generative AI", "description": "ChatGPT. AI images. It makes new things."}], "visual": {"kind": "nested-boxes", "spec": "Four concentric rounded boxes, outermost AI, innermost Generative AI in green."}, "isStudentViewEnabled": true, "id": "slide-14"}, {"type": "content", "title": "Machine Learning", "subtitle": "", "badge": "ML", "points": [{"title": "Instagram never asked what you like", "description": "It watched what you stopped scrolling for."}, {"title": "Nobody wrote the rule", "description": "No engineer typed 'this user likes cricket'. The pattern came out of your behaviour."}], "visual": {"kind": "data-to-rules", "spec": "Left: a pile of example thumbnails. Arrow right: a single clean rule emerging."}, "isStudentViewEnabled": true, "id": "slide-15"}, {"type": "content", "title": "Deep Learning", "subtitle": "", "badge": "DL", "points": [{"title": "Layers of simple maths, stacked deep", "description": "Layer 1 finds edges. Layer 5 finds shapes. Layer 20 finds faces."}, {"title": "Nobody ever defined 'face'", "description": "It built that idea layer by layer. That is your face unlock."}], "visual": {"kind": "layer-progression", "spec": "Three stacked panels of the same face: edges, then shapes, then the recognisable face."}, "isStudentViewEnabled": true, "id": "slide-16"}, {"type": "content", "title": "Generative AI", "subtitle": "", "badge": "GEN AI", "points": [{"title": "Everything above sorts things into buckets", "description": "Spam or not. Your face or not. Output: a label."}, {"title": "This one makes something that never existed", "description": "Writes the email. Draws the image. Output: new content."}], "visual": {"kind": "split-compare", "spec": "Left: input flowing into a single label chip. Right: input flowing into a paragraph being written."}, "isStudentViewEnabled": true, "id": "slide-17"}, {"type": "content", "title": "So what is an LLM?", "subtitle": "", "badge": "LARGE LANGUAGE MODEL", "points": [{"title": "Large", "description": "Billions of settings, trained on trillions of words."}, {"title": "Language", "description": "It was trained on text. Books, code, websites."}, {"title": "Model", "description": "A maths function. Text goes in, text comes out."}], "isStudentViewEnabled": true, "id": "slide-18"}, {"type": "content", "title": "Fill in the blank", "subtitle": "Say it out loud before you look at the next slide.", "badge": "YOU ALREADY DO THIS", "points": [{"title": "\"How are ___\"", "description": "Every single person in this room just thought \"you\"."}, {"title": "Why did you know that?", "description": "Because you have seen that phrase thousands of times. Nobody taught you a rule."}], "visual": {"kind": "fill-blank", "spec": "The text 'How are ___' large on screen, with 'you' appearing beneath it as the obvious completion."}, "isStudentViewEnabled": true, "id": "slide-19"}, {"type": "content", "title": "That is exactly what the AI does", "subtitle": "", "badge": "HOW IT PICKS THE NEXT WORD", "points": [{"title": "It has read a huge amount of text", "description": "So it knows which word usually follows which."}, {"title": "It generates a few possible next words", "description": "Each one gets a confidence score."}, {"title": "It picks the highest, writes it, and repeats", "description": "One word at a time. That is the whole engine."}], "visual": {"kind": "confidence-list", "spec": "The phrase 'How are ___' with four candidate words below it — you 92%, they 4%, we 3%, things 1% — the top one highlighted in green."}, "isStudentViewEnabled": true, "id": "slide-20"}, {"type": "content", "title": "Now — how do you read this sentence?", "subtitle": "", "badge": "START WITH YOURSELF", "points": [{"title": "You don't read letter by letter", "description": "You were trained to see whole words and chunks at once."}, {"title": "AI was never trained the way you were", "description": "So it does the same thing differently — it breaks text into pieces it can handle."}], "isStudentViewEnabled": true, "id": "slide-21"}, {"type": "content", "title": "Those pieces are called tokens", "subtitle": "", "badge": "TOKENS", "points": [{"title": "A word gets chopped into common chunks", "description": "engineering → engine + ering"}, {"title": "And the chunks ignore meaning", "description": "\"engine\" plus a leftover. Not syllables, not roots — just whatever the machine saw most often."}, {"title": "Every chunk becomes a number", "description": "That number is all the model ever sees. Never the letters."}], "visual": {"kind": "word-splitting", "spec": "The word 'engineering' breaking into two chips: engine / ering — the first chip meaningful, the second meaningless."}, "isStudentViewEnabled": true, "id": "slide-22"}, {"type": "content", "title": "Let's look at real tokens", "subtitle": "", "badge": "⚡ LIVE DEMO — WATCH THE SCREEN", "points": [{"title": "Opening the tokenizer now", "description": "platform.openai.com/tokenizer"}, {"title": "Guess before I press enter", "description": "How many chunks will this word break into?"}], "isStudentViewEnabled": true, "id": "slide-23"}, {"type": "content", "title": "Now the same sentence in Tamil", "subtitle": "", "badge": "WHY THIS MATTERS TO YOU", "points": [{"title": "Tamil costs far more tokens", "description": "Same meaning. Many more pieces."}, {"title": "Not because Tamil is harder", "description": "Because these models were trained mostly on English text."}, {"title": "English needs a few chunks for full context", "description": "Tamil needs many more to say the same thing."}], "visual": {"kind": "token-count-compare", "spec": "English row: 5 wide chips. Tamil row: 14 narrow chips overflowing to two rows. Counts on the right."}, "isStudentViewEnabled": true, "id": "slide-24"}, {"type": "content", "title": "Temperature", "subtitle": "Think of it as one slider, from fact to imagination.", "badge": "ONE SETTING, THREE POSITIONS", "points": [{"title": "0 — sticks to facts", "description": "Same question, same answer, every single time."}, {"title": "0.5 — normal", "description": "A sensible, balanced answer. This is the default."}, {"title": "1 — as creative as it can be", "description": "Same question, a different answer each time."}], "visual": {"kind": "temperature-scale", "spec": "A horizontal slider from 0 to 1 with three marked stops — 0 labelled FACT, 0.5 labelled NORMAL, 1 labelled CREATIVE — the handle sitting at 0.5."}, "isStudentViewEnabled": true, "id": "slide-25"}, {"type": "content", "title": "What is a parameter?", "subtitle": "Go back to 'How are ___' for a second.", "badge": "PARAMETERS", "points": [{"title": "Something has to remember that 'you' was likely", "description": "That memory is stored as a number. One number is one parameter."}, {"title": "It has billions of them", "description": "Together they hold every pattern it ever saw. Not sentences — just numbers."}, {"title": "After training they are frozen", "description": "That fixed set of numbers IS the model. Nothing else is stored."}], "visual": {"kind": "equaliser", "spec": "A dense field of small numeric dials at varying positions, three highlighted green, captioned that the whole pattern is the model."}, "isStudentViewEnabled": true, "id": "slide-26"}, {"id": "slide-27", "type": "content", "isStudentViewEnabled": true, "title": "The problem: it lies with a straight face", "badge": "HALLUCINATION", "subtitle": "Every one of you has hit this.", "points": [{"title": "You ask something. It answers confidently.", "description": "Neat, well-structured, sounds completely right."}, {"title": "Then you check, and it was made up", "description": "A fake citation. A function that does not exist. A date that is wrong."}, {"title": "So now you trust nothing it says", "description": "And you waste more time verifying than you saved. Here is why it happens."}]}, {"type": "content", "title": "You watched 10 videos before your exam", "subtitle": "", "badge": "THE SETUP", "points": [{"title": "Ask me a concept — I'll answer fine", "description": "\"What did he teach about AI?\" Easy. I understood it."}, {"title": "Now ask me what was said in the 5th minute", "description": "I don't actually know. But I will not say that."}], "visual": {"kind": "video-timeline", "spec": "A row of 10 video thumbnails with a timeline beneath, a marker at the 5-minute point circled with a question mark."}, "isStudentViewEnabled": true, "id": "slide-28"}, {"type": "content", "title": "You'd guess — and assume you were right", "subtitle": "", "badge": "THAT IS HALLUCINATION", "points": [{"title": "You'd say something that sounds plausible", "description": "Confident. Reasonable. Possibly completely wrong."}, {"title": "The AI does exactly this", "description": "\"This is probably the next word. This is probably the answer.\""}, {"title": "It never says 'I don't know'", "description": "It has no way to leave the page blank."}], "isStudentViewEnabled": true, "id": "slide-29"}, {"type": "content", "title": "So change the instruction", "subtitle": "", "badge": "THE FIX", "points": [{"title": "Don't ask: \"what was said in the 5th minute?\"", "description": "You are asking it to guess."}, {"title": "Ask: \"go to the video, pause at 5:00, read what's there, then tell me\"", "description": "Now it has to look before it speaks."}, {"title": "Precise question, precise answer", "description": "This one habit fixes most of your bad answers."}], "visual": {"kind": "grounding-flow", "spec": "Left: model alone producing an answer marked with a red cross. Right: model plugged into the source, answer marked with a green tick."}, "isStudentViewEnabled": true, "id": "slide-30"}, {"type": "title", "title": "Part 3 — Prompting", "subtitle": "The difference between people who get good answers and people who don't.", "author": "", "badge": "PART 3 OF 5", "isStudentViewEnabled": true, "id": "slide-31"}, {"id": "slide-32", "type": "content", "isStudentViewEnabled": true, "title": "The problem: you keep asking the same thing", "badge": "PROMPTING", "subtitle": "Be honest — how many of you recognise this?", "points": [{"title": "Too generic, so you ask again", "description": "\"No, more detail.\" Still generic."}, {"title": "You rephrase. New chat. Different AI.", "description": "Six attempts. Twenty minutes gone."}, {"title": "You give up and write it yourself", "description": "The tool was never the problem. The instruction was."}], "visual": {"kind": "retry-loop", "spec": "A circular loop of four prompt bubbles — ask, reject, rephrase, ask again — with a clock in the middle showing 20 minutes burned. No exit."}}, {"type": "content", "title": "What is a prompt?", "subtitle": "", "badge": "PROMPT", "points": [{"title": "Everything you type in", "description": "Your question, your files, your instructions. All of it."}], "isStudentViewEnabled": true, "id": "slide-33"}, {"type": "content", "title": "So what is prompt engineering?", "subtitle": "", "badge": "PROMPT ENGINEERING", "points": [{"title": "Writing that instruction properly, on purpose", "description": "Not magic words. Structure."}, {"title": "So you get the answer you wanted the first time", "description": "Instead of asking six times and giving up."}], "isStudentViewEnabled": true, "id": "slide-34"}, {"type": "content", "title": "And people are paid for this", "subtitle": "", "badge": "THE JOB MARKET", "points": [{"title": "Prompt engineering is now a line item on job descriptions", "description": "AI product roles, research roles, content roles, support roles."}, {"title": "It is not a separate career for most of you", "description": "It is a skill inside whatever job you take. Like knowing Excel was, twenty years ago."}, {"title": "Which is exactly why it's worth an hour today", "description": "Nobody is going to teach you this in a lab."}], "isStudentViewEnabled": true, "id": "slide-35"}, {"type": "content", "title": "A good prompt has six parts", "subtitle": "", "badge": "THE STRUCTURE", "points": [{"title": "Role + Context", "description": "Who it should be, and what it needs to know about you."}, {"title": "Task + Format", "description": "Exactly what to do, and the shape you want back."}, {"title": "Constraints + Examples", "description": "The limits, and a sample of what good looks like."}], "visual": {"kind": "prompt-anatomy", "spec": "One prompt block as six stacked bands labelled ROLE, CONTEXT, TASK, FORMAT, CONSTRAINTS, EXAMPLES."}, "isStudentViewEnabled": true, "id": "slide-36"}, {"type": "content", "title": "Watch it on something small first", "subtitle": "", "badge": "BEFORE", "points": [{"title": "\"make my resume point better\"", "description": "This is what most of you would type. Watch what comes back."}], "isStudentViewEnabled": true, "id": "slide-37"}, {"type": "prompt-card", "title": "Now watch a real one", "subtitle": "This is what a prompt that actually works looks like. Read the labels, not the words.", "badge": "📋 THE WORKED EXAMPLE", "promptText": "# ROLE\nYou are a technical recruiter at a top product company. You screen 200+ fresher\nresumes a week and you reject most of them in under 8 seconds.\n\n# CONTEXT\nI am a 2nd-year AI & Data Science student. No internship yet. My only real\nproject is a college attendance system using face recognition — Python, OpenCV\nand a small CNN. Three classes used it for one semester, about 120 students.\nIt cut roll-call from 6 minutes to under 30 seconds. It broke badly in low\nlight and I never fully fixed that.\n\n# TASK\nRewrite my resume's project section so it survives your 8-second scan.\n\n# FORMAT\nGive me exactly three versions:\n  1. IMPACT-FIRST  — leads with the number\n  2. TECHNICAL     — leads with what I actually built\n  3. SHORT         — one line, under 20 words\nUnder each, add one line starting \"Why this works:\"\n\n# CONSTRAINTS\n- Every version must use a real number I gave you\n- Do NOT invent accuracy figures, users, awards or results\n- Banned words: innovative, cutting-edge, leveraged, spearheaded, passionate\n- Resume voice. No sentences starting with \"I\".\n\n# EXAMPLE OF THE STYLE I WANT\n\"Cut manual roll-call from 6 min to 28 s across 3 classes (120 students) by\nshipping an OpenCV + CNN face-recognition attendance system.\"\n\n# ONE LAST THING\nAfter the three versions, tell me the single weakest thing about this project\nas a hiring signal — and what I should build next to fix it.", "isStudentViewEnabled": true, "id": "slide-38"}, {"type": "content", "title": "Now do it for your email", "subtitle": "This is the whole point of the morning.", "badge": "⚡ TASK 2 — 8 MINUTES", "points": [{"title": "Write the Nexora AI email again", "description": "Same role. Same hiring manager. Same details."}, {"title": "But this time, build the prompt first", "description": "Role, context, task, format, constraints."}, {"title": "Then compare it to what you wrote at 10am", "description": "Same person. Same tool. One hour apart."}], "isStudentViewEnabled": true, "id": "slide-39"}, {"type": "content", "title": "One last thing before lunch", "subtitle": "", "badge": "CONTEXT WINDOW", "points": [{"title": "Everything it can see right now", "description": "Your question, this conversation, any file you attached."}, {"title": "Outside that window, nothing exists", "description": "Like an open-book exam — only what's actually on your desk counts."}], "visual": {"kind": "window-frame", "spec": "A bright green frame containing a few documents, with more documents outside the frame drawn very faint."}, "isStudentViewEnabled": true, "id": "slide-40"}, {"type": "content", "title": "Which is why the long ones get worse", "subtitle": "", "badge": "THE CATCH", "points": [{"title": "Don't paste 200 pages and hope", "description": "Things buried in the middle get forgotten first."}, {"title": "Give it the 3 pages that matter", "description": "Smaller and sharper beats bigger every time."}], "visual": {"kind": "attention-curve", "spec": "A long document bar with a recall curve above it — high at the start, sagging badly in the middle, rising at the end."}, "isStudentViewEnabled": true, "id": "slide-41"}, {"type": "title", "title": "Lunch", "subtitle": "This afternoon you stop learning about AI and start building with it. Five things, none of them paid.", "author": "", "badge": "BREAK · BACK AT 2:00", "isStudentViewEnabled": true, "id": "slide-42"}, {"type": "title", "title": "Part 4 — Now build things", "subtitle": "Five projects. Free accounts only. No API keys, no installs.", "author": "", "badge": "PART 4 OF 5", "isStudentViewEnabled": true, "id": "slide-43"}, {"type": "content", "title": "Project 1 — a LinkedIn post engine", "subtitle": "", "badge": "CLAUDE PROJECTS", "points": [{"title": "You'll write posts for the next 3 years", "description": "Placements, projects, internships, certifications."}, {"title": "Right now you start from a blank box every time", "description": "And it shows."}, {"title": "Build it once, use it forever", "description": "A Claude Project remembers your instructions and your style."}], "isStudentViewEnabled": true, "id": "slide-44"}, {"type": "content", "title": "Four steps. Follow along.", "subtitle": "", "badge": "⚡ DO THIS NOW", "points": [{"title": "1. claude.ai → Projects → Create", "description": "Call it 'My LinkedIn Engine'."}, {"title": "2. Paste the instructions", "description": "Next slide has them."}, {"title": "3. Add one post you liked", "description": "Any creator. That teaches it your taste."}, {"title": "4. Ask it for a post about today", "description": "About this session. Then read it out."}], "isStudentViewEnabled": true, "id": "slide-45"}, {"type": "prompt-card", "title": "Your LinkedIn Project instructions", "subtitle": "Paste this into 'Set project instructions'. Change the bracketed bits to yours.", "badge": "📋 COPY THIS — PROJECT 1", "promptText": "You write LinkedIn posts for a 2nd-year AI & Data Science student in Coimbatore.\n\nAbout me: [your name], studying at [college]. I post about what I'm learning, projects I build, and things I got wrong.\n\nEvery post you write must:\n- Open with one specific line. Never \"I'm excited to share\".\n- Be under 150 words.\n- Contain one real detail or number from what I tell you.\n- End with a genuine question, not a call to action.\n- Sound like a student, not a consultant.\n\nNever use: leverage, delve, unlock, game-changer, thrilled, humbled.\nIf I give you nothing specific, ask me one question before writing.", "isStudentViewEnabled": true, "id": "slide-46"}, {"type": "content", "title": "Project 2 — recreate this image", "subtitle": "Look at it properly for thirty seconds before you write anything.", "badge": "IMAGE GENERATION", "points": [{"title": "Write a prompt that recreates it", "description": "ChatGPT or Gemini, whichever you already have open."}, {"title": "Same six parts as before", "description": "Style, subject, composition, lighting, colour — and what to leave out."}, {"title": "Then beat it", "description": "Yours will land close. Now make it better than mine."}], "isStudentViewEnabled": true, "id": "slide-47", "visual": {"kind": "image-target", "spec": "Reference image to recreate: flat-illustration night desk scene — dark blue room, window with moon and stars, wooden desk, open laptop with glowing green screen, stack of three coloured books, steaming mug."}}, {"type": "content", "title": "Project 3 — read a whole textbook in 4 minutes", "subtitle": "", "badge": "NOTEBOOKLM", "points": [{"title": "Upload a YouTube lecture, a PDF, your notes", "description": "notebooklm.google.com — free with your college Google account."}, {"title": "It only answers from what you gave it", "description": "Which is grounding. The thing we did this morning."}, {"title": "Ask it for a revision sheet", "description": "Then ask it what you'd probably get wrong."}], "isStudentViewEnabled": true, "id": "slide-48"}, {"type": "content", "title": "Project 4 — your exam study partner", "subtitle": "", "badge": "PERSONAL PROJECT", "points": [{"title": "A Claude Project that plans your revision", "description": "Give it your syllabus and your exam date."}, {"title": "It builds the plan and tracks what you've done", "description": "You open it each evening and tell it what you covered."}, {"title": "It updates the plan around what you missed", "description": "Because it remembers everything in the project."}], "isStudentViewEnabled": true, "id": "slide-49"}, {"type": "prompt-card", "title": "Your Study Partner instructions", "subtitle": "Paste this into a second Claude Project. Upload your syllabus.", "badge": "📋 COPY THIS — PROJECT 4", "promptText": "You are my exam study partner for [SUBJECT]. My exam is on [DATE].\n\nUse only the syllabus and notes uploaded to this project. If something is not in them, say \"NOT IN YOUR NOTES\" instead of guessing.\n\nWhen I first talk to you, build me a day-by-day revision plan up to my exam date, hardest topics first.\n\nEvery time I come back, ask me these three things:\n1. What did you actually study since we last spoke?\n2. What did you not get to?\n3. What still doesn't make sense?\n\nThen rewrite the remaining plan around my answers. Keep a running list of my weak topics and remind me of them.\n\nBe direct. If I'm behind, tell me I'm behind.", "isStudentViewEnabled": true, "id": "slide-50"}, {"type": "content", "title": "But you still have to show up", "subtitle": "Everything you built today waits for you to open it.", "badge": "THE CATCH", "points": [{"title": "The study partner only works if you remember it", "description": "Miss three days and it has no idea you fell behind."}, {"title": "Same with the LinkedIn engine", "description": "It's sitting there, waiting. It never starts on its own."}, {"title": "So what if it didn't wait for you?", "description": "What if the work was already done when you woke up?"}], "isStudentViewEnabled": true, "id": "slide-51"}, {"type": "content", "title": "Let me draw you something", "subtitle": "", "badge": "ON THE BOARD", "points": [{"title": "Say you want the top AI news every morning", "description": "Not you going and searching. It going and searching."}, {"title": "Forget tools for a second", "description": "If you were telling a person to do this job for you every day — what would you actually say to them?"}], "isStudentViewEnabled": true, "id": "slide-52"}, {"type": "content", "title": "You'd say something like this", "subtitle": "That's it. That's the whole workflow. Four sentences.", "badge": "THE WHOLE THING, IN PLAIN ENGLISH", "points": [{"title": "\"Every morning at seven, wake up.\"", "description": "That's the schedule. It starts on its own, you don't press anything."}, {"title": "\"Go online and find the five biggest AI stories.\"", "description": "That's the search. Then do the same for startup news."}, {"title": "\"Write them all into my Google Sheet.\"", "description": "That's where it puts the answer. Somewhere you'll actually look."}, {"title": "\"Then go back to sleep until tomorrow.\"", "description": "And it does. Every single day. Without being asked again."}], "isStudentViewEnabled": true, "visual": {"kind": "news-workflow", "spec": "A simple left-to-right whiteboard flow: a clock labelled 7:00 AM, arrow to a globe labelled 'search the web', arrow to a box labelled 'pick the top 5', arrow to a spreadsheet labelled 'write it down'. Hand-drawn feel, no tool logos."}, "id": "slide-53"}, {"type": "content", "title": "That's all an automation is", "subtitle": "", "badge": "THE POINT", "points": [{"title": "A trigger, some steps, and a place to put the answer", "description": "Nothing more complicated than what you just heard."}, {"title": "The tool doesn't matter", "description": "n8n, Zapier, Make, a Claude routine. They all do those four sentences."}, {"title": "What matters is that you can describe it", "description": "If you can say it out loud in order, someone can build it. Including you."}], "isStudentViewEnabled": true, "id": "slide-54"}, {"type": "content", "title": "And that's the difference", "subtitle": "", "badge": "WHERE THE 16% ARE", "points": [{"title": "Today you made AI answer you", "description": "Five times. Better each time."}, {"title": "This makes AI go and do something", "description": "While you're asleep, in class, or not thinking about it at all."}, {"title": "That's what I build at work", "description": "And it is genuinely not as hard as it sounds."}], "isStudentViewEnabled": true, "id": "slide-55"}, {"type": "title", "title": "Part 5 — What now", "subtitle": "You built five things today. Here's what to do with them.", "author": "", "badge": "PART 5 OF 5", "isStudentViewEnabled": true, "id": "slide-56"}, {"type": "content", "title": "What you actually made today", "subtitle": "", "badge": "IN FOUR HOURS", "points": [{"title": "An email you can send tomorrow", "description": "And proof you write better than you did at 10am."}, {"title": "A LinkedIn engine and a study partner", "description": "Both still working next semester."}, {"title": "An image prompt and a research assistant", "description": "Two tools most people your age don't know exist."}], "isStudentViewEnabled": true, "id": "slide-57"}, {"type": "content", "title": "Where to go from here", "subtitle": "", "badge": "NEXT STEPS", "points": [{"title": "Use the study partner for THIS semester", "description": "Not next one. The one you're in. Open it tonight."}, {"title": "Post one thing on LinkedIn this week", "description": "Use your engine. About what you built today."}, {"title": "Then learn to make AI do things, not just say things", "description": "That is agents — and that is where the 16% are."}], "isStudentViewEnabled": true, "id": "slide-58"}, {"type": "qna", "title": "Questions?", "subtitle": "Anything — about AI, your projects, placements, or what I actually do all day. Best questions get spotlighted and climb the leaderboard.", "badge": "LIVE Q&A", "isStudentViewEnabled": true, "id": "slide-59"}, {"type": "conclusion", "title": "One thing to remember", "subtitle": "If you forget everything else from today.", "badge": "THAT'S A WRAP", "takeaways": ["AI does not look anything up. It predicts what usually comes next.", "That one fact explains why it invents things, and why grounding fixes it.", "A good prompt has six parts. Most bad prompts are missing four of them.", "Give it the source. Don't ask about your syllabus — paste your syllabus in.", "Everyone can use ChatGPT. Understanding it is the part that pays."], "isStudentViewEnabled": true, "id": "slide-60"}];</script>
<script>
const D=DECK;
const E=(s)=>document.createElement(s);
function esc(t){return (t==null?'':String(t)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function ph(t){return esc(t).replace(/\[\[(.*?)\]\]/g,'<span class="ph">[[$1]]</span>');}
function hasPH(s){return JSON.stringify(s).includes('[[');}
function chars(s){let n=(s.title||'').length+(s.subtitle||'').length;
 (s.points||[]).forEach(p=>n+=(p.title||'').length+(p.description||'').length);
 (s.takeaways||[]).forEach(t=>n+=t.length); return n;}

/* ================= DIAGRAMS ================= */
const C={cy:'#047857', am:'#047857', pu:'#334155', gn:'#047857', ro:'#b4232a',
 ln:'#c3cdd8', ink:'#0f172a', mut:'#5b6779'};
const S=(inner,vb='-14 -14 328 228')=>`<svg viewBox="${vb}" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const box=(x,y,w,h,c,sw=2,r=8)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" stroke="${c}" stroke-width="${sw}"/>`;
const txt=(x,y,t,c=C.mut,sz=11,w=600,a='middle')=>`<text x="${x}" y="${y}" fill="${c}" font-size="${sz}" font-weight="${w}" text-anchor="${a}" font-family="system-ui">${t}</text>`;
const chip=(x,y,w,t,c)=>`${box(x,y,w,22,c,1.5,5)}${txt(x+w/2,y+15,t,c,10)}`;
const arw=(x1,y1,x2,y2,c=C.ln)=>`<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${c}" stroke-width="2" marker-end="url(#ah)"/>`;
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${C.ln}"/></marker></defs>`;

const DIA={
 'nested-boxes':()=>S(`${box(10,15,280,170,C.ln)}${txt(150,32,'ARTIFICIAL INTELLIGENCE',C.mut,10)}
  ${box(32,44,236,128,'#3f4b5c')}${txt(150,60,'MACHINE LEARNING','#8b96a5',10)}
  ${box(54,72,192,86,C.pu)}${txt(150,88,'DEEP LEARNING',C.pu,10)}
  ${box(76,100,148,44,C.cy)}${txt(150,120,'GENERATIVE AI',C.cy,11,700)}${txt(150,134,'ChatGPT lives here',C.mut,9)}`),
 'data-to-rules':()=>S(`${DEFS}${[0,1,2].map(i=>box(18+i*14,60+i*10,52,34,C.ln,1.5,4)).join('')}
  ${txt(56,120,'messy examples',C.mut,10)}${arw(112,95,158,95)}
  ${box(172,68,104,54,C.cy)}${txt(224,92,'RULE',C.cy,13,700)}${txt(224,108,'discovered',C.mut,9)}
  ${txt(150,168,'you supply data — it produces the rule',C.mut,10)}`),
 'layered-nodes':()=>S(`${[0,1,2].map(c=>[0,1,2,3].map(r=>`<circle cx="${60+c*90}" cy="${50+r*34}" r="8" stroke="${c===1?C.cy:C.ln}" stroke-width="2"/>`).join('')).join('')}
  ${[0,1].map(c=>[0,1,2,3].map(r=>[0,1,2,3].map(r2=>`<line x1="${68+c*90}" y1="${50+r*34}" x2="${142+c*90}" y2="${50+r2*34}" stroke="${C.ln}" stroke-width=".5" opacity=".55"/>`).join('')).join('')).join('')}
  ${txt(60,180,'in',C.mut,10)}${txt(150,180,'hidden',C.mut,10)}${txt(240,180,'out',C.mut,10)}`),
 'layer-progression':()=>S(`${[['Layer 1 — edges',C.ln],['Layer 5 — shapes',C.pu],['Layer 20 — faces',C.cy]].map((L,i)=>
  `${box(40,18+i*58,220,44,L[1])}${txt(150,45+i*58,L[0],i===2?C.cy:C.mut,11,650)}`).join('')}`),
 'text-to-numbers':()=>S(`${DEFS}${box(24,72,86,42,C.ln)}${txt(67,99,'"hello"',C.ink,15,600)}
  ${arw(120,93,168,93)}${box(180,72,100,42,C.cy)}${txt(230,99,'[0.2, 0.9, …]',C.cy,12)}
  ${txt(150,150,'language becomes maths',C.mut,10)}`),
 'split-compare':()=>S(`<line x1="150" y1="18" x2="150" y2="182" stroke="${C.ln}" stroke-width="1.5" stroke-dasharray="4 4"/>
  ${txt(75,36,'DISCRIMINATIVE',C.mut,10,800)}${box(30,52,90,34,C.ln)}${txt(75,74,'input',C.mut,11)}
  ${box(42,110,66,30,C.ro,2,15)}${txt(75,130,'SPAM',C.ro,12,700)}
  ${txt(225,36,'GENERATIVE',C.cy,10,800)}${box(180,52,90,34,C.ln)}${txt(225,74,'input',C.mut,11)}
  ${box(168,104,114,44,C.cy)}${txt(225,122,'new text being',C.cy,10)}${txt(225,136,'written…',C.cy,10)}`),
 'token-prediction-chain':()=>S(`${['The','cat','sat','on'].map((t,i)=>chip(18+i*54,96,46,t,C.ln)).join('')}
  ${chip(234,96,48,'the',C.cy)}

function diagram(v){ if(!v||!DIA[v.kind]) return ''; try{return DIA[v.kind]();}catch(e){return '';} }

/* ================= RENDER ================= */
function render(s,i){
 const el=E('div'); el.className='slide';
 const vis=diagram(s.visual); let r=0;
 const R=()=>`style="animation-delay:${(r++)*150}ms"`;
 const badge=s.badge?`<div class="badge ${/DEMO|DO THIS/.test(s.badge)?'demo':''} rv" ${R()}>${esc(s.badge)}</div>`:'';

 if(s.type==='title'){
  el.className='slide tt';
  el.innerHTML=`${badge}<h1 class="st rv" ${R()}>${ph(s.title)}</h1>
   ${s.subtitle?`<div class="sub rv" ${R()}>${ph(s.subtitle)}</div>`:''}
   ${s.author?`<div class="author rv" ${R()}>${esc(s.author)}</div>`:''}`;
  return el;
 }
 let body='';
 if(s.type==='content'){
  body=`${badge}<h1 class="st rv" ${R()}>${ph(s.title)}</h1>
   ${s.subtitle?`<div class="sub rv" ${R()}>${ph(s.subtitle)}</div>`:''}
   <div class="pts">${(s.points||[]).map(p=>`<div class="pt rv" ${R()}>
     <div class="pth">${ph(p.title)}</div>
     ${p.description?`<div class="ptd">${ph(p.description)}</div>`:''}</div>`).join('')}</div>`;
 } else if(s.type==='poll'){
  body=`${badge}<h1 class="st rv" ${R()}>${ph(s.title)}</h1>
   <div class="qn rv" ${R()}>${ph(s.question)}</div>
   <div class="opts">${s.options.map((o,k)=>`<div class="opt rv" ${R()}>
     <span class="k">${'ABCD'[k]}</span><span>${esc(o.text.replace(/^[A-D]\)\s*/,''))}</span></div>`).join('')}</div>
   <div class="livetag"><i></i>LIVE IN PULSEDECK</div>`;
 } else if(s.type==='prompt-card'){
  body=`${badge}<h1 class="st rv" ${R()}>${ph(s.title)}</h1>
   ${s.subtitle?`<div class="sub rv" ${R()}>${ph(s.subtitle)}</div>`:''}
   <div class="pcard rv" ${R()}>${ph(s.promptText)}</div>`;
 } else if(s.type==='qna'){
  body=`${badge}<h1 class="st rv" ${R()}>${ph(s.title)}</h1>
   ${s.subtitle?`<div class="sub rv" ${R()}>${ph(s.subtitle)}</div>`:''}
   <div class="livetag"><i></i>LIVE IN PULSEDECK</div>`;
 } else if(s.type==='conclusion'){
  body=`${badge}<h1 class="st rv" ${R()}>${ph(s.title)}</h1>
   ${s.subtitle?`<div class="sub rv" ${R()}>${ph(s.subtitle)}</div>`:''}
   <div class="tks">${s.takeaways.map((t,k)=>`<div class="tk rv" ${R()}>
     <span class="n">${k+1}</span><span>${ph(t)}</span></div>`).join('')}</div>`;
 }
 if(vis){ el.classList.add('cols');
  el.innerHTML=`<div class="stxt">${body}</div><div class="svis">${vis}</div>`;
 } else el.innerHTML=body;
 return el;
}

/* ================= NAV ================= */
let cur=0; const deckEl=document.getElementById('deck');
const PARTS=D.map(s=>s.type==='title'&&/^PART/.test(s.badge||'')?s.title:null);
function partFor(i){for(let j=i;j>=0;j--)if(PARTS[j])return PARTS[j];return 'Opening';}
function show(i){
 cur=Math.max(0,Math.min(D.length-1,i));
 deckEl.innerHTML='';
 const el=render(D[cur],cur);           // fresh node每 slide → stagger always replays
 deckEl.appendChild(el);
 void el.offsetWidth;                    // force reflow before adding .go
 el.classList.add('go');
 document.getElementById('bar').style.width=((cur+1)/D.length*100)+'%';
 document.getElementById('num').textContent=cur+1;
 document.getElementById('part').textContent=partFor(cur);
 location.hash=cur+1;
}
function go(n){show(cur+n);}
addEventListener('keydown',e=>{
 if(e.key==='o'||e.key==='O'){document.body.classList.toggle('overview');return;}
 if(document.body.classList.contains('overview')){if(e.key==='Escape')document.body.classList.remove('overview');return;}
 if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(1);}
 if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
 if(e.key==='Home')show(0); if(e.key==='End')show(D.length-1);
 if(e.key==='f'||e.key==='F'){document.documentElement.requestFullscreen?.();}
});
deckEl.addEventListener('click',e=>go(e.clientX<innerWidth*0.25?-1:1));

/* ================= OVERVIEW ================= */
(function(){
 const g=document.getElementById('grid'); let last=null;
 D.forEach((s,i)=>{
  const p=partFor(i);
  if(p!==last){last=p;const h=E('div');h.className='pt-head';h.textContent=p;g.parentNode.insertBefore(h,g);
   const ng=E('div');ng.className='grid';g.parentNode.insertBefore(ng,g);window.__g=ng;}
  const t=window.__g||g;
  const m=E('div'); m.className='mini';
  const P=hasPH(s), dense=chars(s)>320;
  if(P)m.classList.add('hasph'); else if(dense)m.classList.add('dense');
  m.innerHTML=`<div class="mn">${i+1}</div>
   <div class="mb">${esc(s.badge||s.type)}</div>
   <div class="mt">${ph(s.title)}</div>
   ${s.subtitle?`<div class="ms">${ph(s.subtitle)}</div>`:''}
   <div class="mp">${(s.points||[]).map(x=>'· '+esc(x.title)).join('<br>')||
     (s.takeaways||[]).map(x=>'· '+esc(x)).slice(0,3).join('<br>')||
     (s.options||[]).map(x=>'· '+esc(x.text)).join('<br>')||''}</div>
   ${P?'<div class="flag ph">needs input</div>':dense?'<div class="flag dn">dense</div>':
     s.visual?'<div class="flag vs">◆ '+esc(s.visual.kind)+'</div>':''}`;
  m.onclick=()=>{document.body.classList.remove('overview');show(i);};
  t.appendChild(m);
 });
 document.getElementById('n-slides').textContent=D.length;
 document.getElementById('n-ph').textContent=(JSON.stringify(D).match(/\[\[/g)||[]).length;
 document.getElementById('n-vis').textContent=D.filter(s=>s.visual).length;
 document.getElementById('n-dense').textContent=D.filter(s=>chars(s)>320).length;
})();

const h=parseInt(location.hash.slice(1)); show(h?h-1:0);
</script>
</body></html>
